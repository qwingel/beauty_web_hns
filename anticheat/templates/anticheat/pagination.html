{% if entries.paginator.num_pages > 1 %}
    <nav class="pagination" aria-label="Страницы">
        {% if entries.has_previous %}<a{% if preserve_stats %} data-stats-context{% endif %} href="{% querystring page=entries.previous_page_number %}">← Назад</a>{% endif %}
        <span class="muted">{{ entries.number }} / {{ entries.paginator.num_pages }}</span>
        {% if entries.has_next %}<a{% if preserve_stats %} data-stats-context{% endif %} href="{% querystring page=entries.next_page_number %}">Далее →</a>{% endif %}
    </nav>
{% endif %}

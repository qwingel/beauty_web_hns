{% if entries.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Страницы">{% if entries.has_previous %}<a href="?page={{ entries.previous_page_number }}&q={{ query|urlencode }}&detected={% if detected_only %}1{% endif %}">← Назад</a>{% endif %}<span class="muted">{{ entries.number }} / {{ entries.paginator.num_pages }}</span>{% if entries.has_next %}<a href="?page={{ entries.next_page_number }}&q={{ query|urlencode }}&detected={% if detected_only %}1{% endif %}">Далее →</a>{% endif %}</nav>{% endif %}

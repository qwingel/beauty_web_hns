{% extends "community/base.html" %}

{% block title %}Beauty — вход через Steam{% endblock %}
{% block main_class %}auth-main{% endblock %}

{% block content %}
    <section class="profile-panel auth-card" aria-labelledby="auth-title">
        <h1 id="auth-title">Вход в Beauty</h1>
        <p class="profile-alternative">Вход через Steam пока недоступен.</p>
        <p class="profile-alternative"><button class="connect" type="button" disabled>Войти через Steam</button></p>
        <p class="profile-alternative"><a class="data-link" href="{% url 'profile-login' %}">Войти с паролем</a></p>
    </section>
{% endblock %}

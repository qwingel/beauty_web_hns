server {
    listen 80;
    listen [::]:80;
    server_name beauty-cs.ru beautyhns.ru beautyhns.online;
    server_tokens off;

    include snippets/fastdl.conf;
    include snippets/beauty-mix.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/beauty-site-acme;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-store";
        return 301 https://beautyhns.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name beauty-cs.ru beautyhns.online;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/beauty-cs.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beauty-cs.ru/privkey.pem;

    add_header Cache-Control "no-store";
    return 301 https://beautyhns.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name beautyhns.ru;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/beauty-cs.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beauty-cs.ru/privkey.pem;

    include snippets/fastdl.conf;
    include snippets/beauty-mix.conf;
    include snippets/beauty-anticheat.conf;

    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }
    location = /bans { return 302 https://152.228.115.212$request_uri; }
    location ^~ /bans/ { return 302 https://152.228.115.212$request_uri; }

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Server;
    }
}

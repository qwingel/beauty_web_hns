[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "beauty-site"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["Django>=5.2.10,<5.3", "psycopg[binary]>=3.2,<4", "ijson>=3.3,<4", "boto3>=1.36,<2", "gunicorn>=23,<24; sys_platform != 'win32'"]

[tool.setuptools.package-data]
anticheat = ["templates/anticheat/*.html", "static/anticheat/*.css"]

[project.optional-dependencies]
test = ["moto[s3]>=5,<6"]

[tool.setuptools.packages.find]
include = ["config*", "accounts*", "anticheat*"]
